<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
<rect width="1000" height="680" fill="white"/>
<defs><marker id="dimension" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M7 0L0 3.5L7 7Z" fill="#0891b2"/></marker></defs>
<g font-family="DejaVu Sans,sans-serif">
<text x="45.000" y="45.000" font-size="27" fill="#0f172a" text-anchor="start" font-weight="bold">Rev D — horizontal LCD alignment</text>
<text x="45.000" y="78.000" font-size="18" fill="#334155" text-anchor="start" >The visible screen and case opening share the board center.</text>
<rect x="100" y="180" width="600" height="290" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="118.6" y="190" width="510" height="260" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
<rect x="131.4" y="191" width="497.2" height="258" fill="#111827"/>
<rect x="186.4" y="206.5" width="427.2" height="227" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/>
<rect x="182.5" y="202.5" width="435" height="235" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="400.000" y1="115.000" x2="400.000" y2="495.000" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="373.600" y1="445.000" x2="373.600" y2="505.000" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="400.000" y="304.000" font-size="24" fill="#075985" text-anchor="middle" font-weight="bold">VISIBLE LCD</text>
<text x="400.000" y="338.000" font-size="17" fill="#075985" text-anchor="middle" >42.72 mm wide</text>
<text x="400.000" y="366.000" font-size="17" fill="#075985" text-anchor="middle" >center x = 30.00 mm</text>
<text x="100.000" y="145.000" font-size="16" fill="#334155" text-anchor="start" >Board left: x = 0</text>
<text x="700.000" y="145.000" font-size="16" fill="#334155" text-anchor="end" >Board right: x = 60</text>
<text x="740.000" y="245.000" font-size="18" fill="#475569" text-anchor="start" >ESP PCB body</text>
<text x="740.000" y="276.000" font-size="17" fill="#475569" text-anchor="start" >center x = 27.36</text>
<text x="740.000" y="309.000" font-size="18" fill="#475569" text-anchor="start" >2.64 mm left</text>
<text x="740.000" y="335.000" font-size="17" fill="#475569" text-anchor="start" >of board center</text>
<text x="740.000" y="398.000" font-size="16" fill="#0891b2" text-anchor="start" >Cyan dashed:</text>
<text x="740.000" y="423.000" font-size="16" fill="#0891b2" text-anchor="start" >case opening</text>
<line x1="100.000" y1="165.000" x2="186.400" y2="165.000" stroke="#0891b2" stroke-width="1.3" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
<text x="143.200" y="126.000" font-size="17" fill="#0891b2" text-anchor="middle" >8.64 mm</text>
<line x1="100.000" y1="162.000" x2="100.000" y2="210.000" stroke="#0891b2" stroke-width="1" />
<line x1="186.400" y1="162.000" x2="186.400" y2="210.000" stroke="#0891b2" stroke-width="1" />
<line x1="613.600" y1="165.000" x2="700.000" y2="165.000" stroke="#0891b2" stroke-width="1.3" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
<text x="656.800" y="126.000" font-size="17" fill="#0891b2" text-anchor="middle" >8.64 mm</text>
<line x1="613.600" y1="162.000" x2="613.600" y2="210.000" stroke="#0891b2" stroke-width="1" />
<line x1="700.000" y1="162.000" x2="700.000" y2="210.000" stroke="#0891b2" stroke-width="1" />
<text x="45.000" y="543.000" font-size="20" fill="#0f172a" text-anchor="start" >Equal visible-screen margins: 8.64 mm left / 8.64 mm right.</text>
<text x="45.000" y="580.000" font-size="17" fill="#334155" text-anchor="start" >The LCD pixels are offset within the module; the PCB body is shifted to compensate.</text>
<text x="45.000" y="617.000" font-size="16" fill="#64748b" text-anchor="start" >Board section shown. Exact LCD datum remains a first-article fit check.</text>
</g></svg>